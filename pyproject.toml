[project]
name = "turkish-sentiment-analysis"
version = "0.1.0"
description = "A Flask web app for Turkish sentiment analysis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1,<4",
    "keras==3.15.1",
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "pandas>=3,<4",
    "scikit-learn>=1.7,<2",
    "tensorflow==2.20.0",
]

[tool.uv]
package = false

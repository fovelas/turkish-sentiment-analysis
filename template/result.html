<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Result</title>
    <!-- <link rel="icon" href="/docs/4.0/assets/img/favicons/favicon.ico"> -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            display: -ms-flexbox;
            display: -webkit-box;
            display: flex;
            flex-direction: column;
            -ms-flex-align: center;
            -ms-flex-pack: center;
            -webkit-box-align: center;
            align-items: center;
            -webkit-box-pack: center;
            justify-content: center;
            padding-top: 40px;
            padding-bottom: 40px;
            background-color: #f5f5f5;
        }

        .form {
            width: 100%;
            max-width: 330px;
            margin: 0 auto;
        }

        .form .checkbox {
            font-weight: 400;
        }

        .form .form-control {
            position: relative;
            box-sizing: border-box;
            height: auto;
            padding: 10px;
            font-size: 16px;
        }

        .form .form-control:focus {
            z-index: 2;
        }

        .form button[type="submit"] {
            text-align: center;
        }

        a:hover {
            color: #777;
        }
    </style>
</head>

<body class="text-center">
    <p class="mt-5"><a href="/" class="text-muted">&#60;&#60; back</a></p>
    <table class="table table-bordered" style="width: 50%;">
        <thead>
            <tr>
                <th scope="col" style="width:40%">Prediction</th>
                <th scope="col">Negative</th>
                <th scope="col">Positive</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2" style="vertical-align:middle;text-align:center;">{{ result }}</td>
                <td>{{ result_negative }}</td>
                <td>{{ result_positive }}</td>
            </tr>
            <tr>
                <td>
                    <form class="form" action="/add_to_negative" method="post">
                        <input type="hidden" id="text" name="text" class="form-control" value="{{ text }}">
                        <button class="btn btn-primary" type="submit">Add to Negative</button>
                    </form>
                </td>
                <td>
                    <form class="form" action="/add_to_positive" method="post">
                        <input type="hidden" id="text" name="text" class="form-control" value="{{ text }}">
                        <button class="btn btn-primary" type="submit">Add to Positive</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>

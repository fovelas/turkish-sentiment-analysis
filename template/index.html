<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sentiment Analysis</title>
    <!-- <link rel="icon" href="/docs/4.0/assets/img/favicons/favicon.ico"> -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            display: -ms-flexbox;
            display: -webkit-box;
            display: flex;
            -ms-flex-align: center;
            -ms-flex-pack: center;
            -webkit-box-align: center;
            align-items: center;
            -webkit-box-pack: center;
            justify-content: center;
            padding-top: 40px;
            padding-bottom: 40px;
            background-color: #f5f5f5;
        }

        .form {
            width: 100%;
            max-width: 330px;
            padding: 15px;
            margin: 0 auto;
        }

        .form .checkbox {
            font-weight: 400;
        }

        .form .form-control {
            position: relative;
            box-sizing: border-box;
            height: auto;
            padding: 10px;
            font-size: 16px;
        }

        .form .form-control:focus {
            z-index: 2;
        }

        .form input[type="text"] {
            margin-bottom: 10px;
        }

        .form button[type="submit"] {
            margin-bottom: 10px;
        }
    </style>
</head>

<body class="text-center">
    <form class="form" action="/result" method="post">
        <input type="text" id="text" name="text" class="form-control" placeholder="Type some text.." required autofocus>
        <button class="btn btn-lg btn-primary btn-block" type="submit">Predict</button>
        <p class="mt-5 mb-3 text-muted">&copy; 2022-20xx</p>
        <p class="mt-5 text-muted">negative: {{ negative_size }} | positive: {{ positive_size }}</p>
    </form>
</body>

</html>
